<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacientes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="../css/modals.css">
    <link rel="stylesheet" href="../css/toast.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="paciente.css">
</head>
<body>

<div class="contenedor">

    <aside class="sidebar">

        <div>
            <div class="perfil">
                <img src="../assets/placeholder-user.svg" alt="Usuario">
                <h2>Usuario</h2>
            </div>

            <nav>
                <a href="../dashboard/index.html">
                    <i class="fa-solid fa-house"></i>
                    <span>Inicio</span>
                </a>
                <a href="paciente.html" class="activo">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>Pacientes</span>
                </a>
                <a href="../agenda/agenda.html">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span>Agenda</span>
                </a>
                <a href="../configuracion/configuracion.html">
                    <i class="fa-solid fa-gear"></i>
                    <span>Configuración</span>
                </a>
            </nav>
        </div>

    </aside>

    <main>

        <header>
            <h1>Pacientes</h1>
            <div class="header-actions">
                <button id="btnMigrarCodigos" class="nuevo" type="button" title="Migrar códigos a formato seguro">
                    <i class="fa-solid fa-print"></i> Reimprimir códigos
                </button>
                <button id="vincularCodigo" class="nuevo btn-vinculaciones" type="button" style="display:none;">
                    <i class="fa-solid fa-bell"></i>
                    <span id="vincularCodigoLabel">Vinculaciones</span>
                    <span id="badgePendientes" class="badge-pendientes" hidden>0</span>
                </button>
                <button id="btnSolicitarVinculo" class="nuevo" type="button" style="display:none;">
                    <i class="fa-solid fa-link"></i> Solicitar vinculación
                </button>
                <button id="nuevoPaciente" class="nuevo">
                    <i class="fa-solid fa-plus"></i> Registrar Mascota
                </button>
            </div>
        </header>

        <section id="panelVinculaciones" class="panel-vinculaciones" hidden>
            <div class="panel-vinculaciones-head">
                <h2><i class="fa-solid fa-link"></i> Vinculaciones pendientes</h2>
                <button type="button" id="cerrarPanelVinculaciones" class="btn-cerrar-panel" aria-label="Cerrar">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="contenedorVinculaciones" class="vinculaciones-lista"></div>
        </section>

        <section class="busqueda">
            <div class="input">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="buscar" placeholder="Buscar paciente...">
            </div>
            <button class="qr" type="button" title="Ingresar o escanear código">
                <i class="fa-solid fa-barcode"></i>
            </button>
            <!-- HID wedge: visually hidden but focusable for LS1203 -->
            <input
                type="text"
                id="scanHidInput"
                class="scan-hid-compact"
                data-barcode-target="1"
                autocomplete="off"
                spellcheck="false"
                aria-label="Lector USB de código de barras"
                tabindex="-1">
        </section>

        <section class="lista">
            <div id="contenedorPacientes"></div>
        </section>

    </main>

</div>

<div class="modal" id="modal">
    <div class="ventana">
        <button class="cerrarModal">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <h2>Registrar mascota</h2>
        <form id="formMascota">
            <div class="fila">
                <div>
                    <label>Nombre</label>
                    <input type="text" id="nombre">
                </div>
                <div>
                    <label>Especie</label>
                    <input type="text" id="especie">
                </div>
            </div>
            <div class="fila">
                <div>
                    <label>Raza</label>
                    <input type="text" id="raza">
                </div>
                <div>
                    <label>Edad</label>
                    <input type="number" id="edad">
                </div>
            </div>
            <div class="fila">
                <div>
                    <label>Sexo</label>
                    <select id="sexo">
                        <option>Macho</option>
                        <option>Hembra</option>
                    </select>
                </div>
                <div>
                    <label>Propietario</label>
                    <input type="text" id="propietario">
                </div>
            </div>
            <div class="fila">
                <div>
                    <label>Peso (kg)</label>
                    <input type="text" id="peso" placeholder="Ej: 12.5">
                </div>
                <div>
                    <label>Color</label>
                    <input type="text" id="color" placeholder="Ej: Blanco">
                </div>
            </div>
            <div class="fila">
                <div>
                    <label>Microchip</label>
                    <select id="microchip">
                        <option>No</option>
                        <option>Sí</option>
                    </select>
                </div>
                <div>
                    <label>Foto</label>
                    <input type="file" id="foto">
                </div>
            </div>

            <h3 class="form-seccion">Dieta (opcional)</h3>
            <div class="fila">
                <div>
                    <label>Cantidad recomendada</label>
                    <input type="text" id="dietaCantidad" placeholder="Ej: 250 g/día">
                </div>
                <div>
                    <label>Comidas/día</label>
                    <input type="number" id="dietaComidasDia" min="1" max="6" value="2">
                </div>
            </div>
            <div class="fila">
                <div>
                    <label>Alimentos permitidos</label>
                    <input type="text" id="dietaPermitidos" placeholder="Ej: croquetas, pollo">
                </div>
                <div>
                    <label>Alimentos prohibidos</label>
                    <input type="text" id="dietaProhibidos" placeholder="Ej: chocolate, uvas">
                </div>
            </div>
            <p class="form-hint">Hasta 3 comidas (etiqueta, hora, cantidad, alimento)</p>
            <div id="mealRows">
                <div class="fila meal-row" data-meal="0">
                    <div>
                        <label>Comida 1</label>
                        <input type="text" class="meal-label" placeholder="Desayuno">
                    </div>
                    <div>
                        <label>Hora</label>
                        <input type="time" class="meal-time" value="08:00">
                    </div>
                    <div>
                        <label>Cantidad</label>
                        <input type="text" class="meal-amount" placeholder="120 g">
                    </div>
                    <div>
                        <label>Alimento</label>
                        <input type="text" class="meal-food" placeholder="Croqueta">
                    </div>
                </div>
                <div class="fila meal-row" data-meal="1">
                    <div>
                        <label>Comida 2</label>
                        <input type="text" class="meal-label" placeholder="Cena">
                    </div>
                    <div>
                        <label>Hora</label>
                        <input type="time" class="meal-time" value="18:00">
                    </div>
                    <div>
                        <label>Cantidad</label>
                        <input type="text" class="meal-amount" placeholder="130 g">
                    </div>
                    <div>
                        <label>Alimento</label>
                        <input type="text" class="meal-food" placeholder="Croqueta">
                    </div>
                </div>
                <div class="fila meal-row" data-meal="2">
                    <div>
                        <label>Comida 3 (opcional)</label>
                        <input type="text" class="meal-label" placeholder="">
                    </div>
                    <div>
                        <label>Hora</label>
                        <input type="time" class="meal-time">
                    </div>
                    <div>
                        <label>Cantidad</label>
                        <input type="text" class="meal-amount" placeholder="">
                    </div>
                    <div>
                        <label>Alimento</label>
                        <input type="text" class="meal-food" placeholder="">
                    </div>
                </div>
            </div>

            <h3 class="form-seccion">Primera consulta (opcional)</h3>
            <div class="fila">
                <div>
                    <label>Tipo</label>
                    <select id="consultaTipo">
                        <option value="GENERAL">General</option>
                        <option value="PREVENTIVA">Preventiva</option>
                        <option value="VACUNACION">Vacunación</option>
                        <option value="DESPARASITACION">Desparasitación</option>
                        <option value="ENFERMEDAD">Enfermedad</option>
                        <option value="TRAUMATOLOGIA">Traumatología</option>
                        <option value="REPRODUCTIVA">Reproductiva</option>
                        <option value="SEGUIMIENTO">Seguimiento</option>
                    </select>
                </div>
                <div>
                    <label>Motivo</label>
                    <input type="text" id="consultaMotivo" placeholder="Ej: Chequeo inicial">
                </div>
            </div>
            <label>Diagnóstico</label>
            <textarea id="consultaDiagnostico" rows="2" placeholder="Opcional"></textarea>
            <label>Tratamiento</label>
            <textarea id="consultaTratamiento" rows="2" placeholder="Opcional"></textarea>

            <button class="guardar">Guardar Paciente</button>
        </form>
    </div>
</div>

<div class="modal" id="modalExito">
    <div class="ventana">
        <button class="cerrarModalExito">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <h2>Paciente creado</h2>
        <p>Código: <strong id="exitoCodigo"></strong></p>
        <img id="exitoBarcode" alt="Código de barras" style="max-width:100%;margin:12px 0;">
        <button class="guardar" type="button" id="btnVerExpediente">Ver expediente</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="../js/env.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/toast.js"></script>
<script src="../js/code-modal.js"></script>
<script src="../js/barcode-local.js"></script>
<script src="../js/barcode-hid.js"></script>
<script src="paciente.js"></script>

</body>
</html>
