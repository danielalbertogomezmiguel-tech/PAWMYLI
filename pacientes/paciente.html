<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacientes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="../css/modals.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="paciente.css">
</head>
<body>

<div class="contenedor">

    <aside class="sidebar">

        <div>
            <div class="perfil">
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Doctor">
                <h2>Usuario</h2>
            </div>

            <nav>
                <a href="../dashboard/index.html">
                    <i class="fa-solid fa-house"></i>
                    <span>Inicio</span>
                </a>
                <a href="paciente.html" class="activo">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>Pacientes</span>
                </a>
                <a href="../agenda/agenda.html">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span>Agenda</span>
                </a>
                <a href="../configuracion/configuracion.html">
                    <i class="fa-solid fa-gear"></i>
                    <span>Configuración</span>
                </a>
            </nav>
        </div>

    </aside>

    <main>

        <header>
            <h1>Pacientes</h1>
            <div class="header-actions">
                <button id="vincularCodigo" class="nuevo" style="display:none;">
                    <i class="fa-solid fa-link"></i> Vincular por código
                </button>
                <button id="nuevoPaciente" class="nuevo">
                    <i class="fa-solid fa-plus"></i> Registrar Mascota
                </button>
            </div>
        </header>

        <section class="busqueda">
            <div class="input">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="buscar" placeholder="Buscar paciente...">
            </div>
            <button class="qr" type="button" title="Ingresar o escanear código">
                <i class="fa-solid fa-barcode"></i>
            </button>
        </section>

        <section class="scan-panel">
            <label for="scanHidInput"><i class="fa-solid fa-barcode"></i> Lector USB (Motorola LS1203)</label>
            <input
                type="text"
                id="scanHidInput"
                data-barcode-target="1"
                autocomplete="off"
                spellcheck="false"
                placeholder="Haz clic aquí y escanea el código de barras">
            <p>El lector debe estar en modo teclado (HID). Al escanear se abre el expediente automáticamente.</p>
        </section>

        <section class="lista">
            <div id="contenedorPacientes"></div>
        </section>

    </main>

</div>

<div class="modal" id="modal">
    <div class="ventana">
        <button class="cerrarModal">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <h2>Registrar mascota</h2>
        <form id="formMascota">
            <div class="fila">
                <div>
                    <label>Nombre</label>
                    <input type="text" id="nombre">
                </div>
                <div>
                    <label>Especie</label>
                    <input type="text" id="especie">
                </div>
            </div>
            <div class="fila">
                <div>
                    <label>Raza</label>
                    <input type="text" id="raza">
                </div>
                <div>
                    <label>Edad</label>
                    <input type="number" id="edad">
                </div>
            </div>
            <div class="fila">
                <div>
                    <label>Sexo</label>
                    <select id="sexo">
                        <option>Macho</option>
                        <option>Hembra</option>
                    </select>
                </div>
                <div>
                    <label>Propietario</label>
                    <input type="text" id="propietario">
                </div>
            </div>
            <div class="fila">
                <div>
                    <label>Peso (kg)</label>
                    <input type="text" id="peso" placeholder="Ej: 12.5">
                </div>
                <div>
                    <label>Color</label>
                    <input type="text" id="color" placeholder="Ej: Blanco">
                </div>
            </div>
            <div class="fila">
                <div>
                    <label>Microchip</label>
                    <select id="microchip">
                        <option>No</option>
                        <option>Sí</option>
                    </select>
                </div>
                <div>
                    <label>Foto</label>
                    <input type="file" id="foto">
                </div>
            </div>
            <button class="guardar">Guardar Paciente</button>
        </form>
    </div>
</div>

<div class="modal" id="modalExito">
    <div class="ventana">
        <button class="cerrarModalExito">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <h2>Paciente creado</h2>
        <p>Código: <strong id="exitoCodigo"></strong></p>
        <img id="exitoBarcode" alt="Código de barras" style="max-width:100%;margin:12px 0;">
        <button class="guardar" type="button" id="btnVerExpediente">Ver expediente</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="../js/env.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/code-modal.js"></script>
<script src="../js/barcode-local.js"></script>
<script src="../js/barcode-hid.js"></script>
<script src="paciente.js"></script>

</body>
</html>
