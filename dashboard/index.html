<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Clínica</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/modals.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="contenedor">

    <aside class="sidebar">

        <div>
            <div class="perfilDoctor">
                <img src="../assets/placeholder-user.svg" alt="Usuario">
                <h2>Usuario</h2>
            </div>

            <nav>
                <a href="index.html" class="activo">
                    <i class="fa-solid fa-house"></i>
                    <span>Inicio</span>
                </a>
                <a href="../pacientes/paciente.html">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>Pacientes</span>
                </a>
                <a href="../agenda/agenda.html">
                    <i class="fa-solid fa-calendar-days"></i>
                    <span>Agenda</span>
                </a>
                <a href="../configuracion/configuracion.html">
                    <i class="fa-solid fa-gear"></i>
                    <span>Configuración</span>
                </a>
            </nav>
        </div>

    </aside>

    <main>

        <header>
            <h1>Inicio</h1>
        </header>

        <section class="dashboard">

            <div class="stats">

                <h2>Stats Generales</h2>

                <div class="card">
                    <div class="circulo">—</div>
                    <p>Citas Hoy</p>
                </div>

                <div class="card">
                    <div class="circulo">—</div>
                    <p>Consultas Semana</p>
                </div>

                <div class="card">
                    <div class="circulo">—</div>
                    <p>Recordatorios Pendientes</p>
                </div>

            </div>

            <div class="right">

                <div class="panel">
                    <div class="contenido">
                        <h2>Próximas consultas del día</h2>
                        <ul id="listaConsultas"></ul>
                    </div>
                </div>

                <div class="panel">
                    <div class="contenido">
                        <h2>Citas / recordatorios</h2>
                        <ul id="listaRecordatorios"></ul>
                    </div>
                </div>

            </div>

        </section>

    </main>

</div>

<script src="../js/env.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="app.js"></script>
</body>
</html>
