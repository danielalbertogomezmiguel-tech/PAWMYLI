<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo">
            <i class="fa-solid fa-paw"></i>
        </div>

        <h1>Inicio de Sesión</h1>
        <p class="subtitulo">Sistema de Gestión Veterinaria</p>

        <form id="loginForm">

            <div class="input-group">
                <label>Correo Electrónico</label>
                <div class="input-icon">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="correo" placeholder="Ingrese su correo" required>
                </div>
            </div>

            <div class="input-group">
                <label>Contraseña</label>
                <div class="input-icon">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Ingrese su contraseña" required>
                    <button type="button" id="mostrarPassword">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="extras">
                <label>
                    <input type="checkbox" id="recordar"> Recordar sesión
                </label>
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>

            <button class="btn-auth" type="submit">
                <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
            </button>

        </form>

        <p class="auth-link">
            ¿No tienes cuenta? <a href="registro.html">Regístrate</a>
        </p>

    </div>

</div>

<script src="auth.js"></script>

</body>
</html>
